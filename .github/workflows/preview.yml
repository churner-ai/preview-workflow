# Churner per-PR preview — the reusable half.
#
# A customer calls this from a short workflow of their own (see README.md).
# It uploads the pull request's head commit (a `git archive` of the checkout,
# no history) to the preview stack's build-context bucket, reports `building`
# to Churner through `churner-ai/report-preview`, starts the image build on
# the stack's CodeBuild project — and ends. It does not wait for the build:
# the deploy request rides on the build, and when the build finishes the
# stack's own events function deploys it as this pull request's Fargate
# service at `<pr>.<preview-zone>`, waits for it to answer, and reports
# `ready`, `queued` or `failed` to Churner itself. The build never fetches
# from GitHub, so a private repository needs no CodeBuild source credential.
#
# Fargate is the only runtime. There is no shared preview host and no SSM
# path: every preview is one ECS service, scaled to zero when idle and woken
# by its next request.
#
# A commit with no `Dockerfile` at its root has no app to preview yet: the job
# builds nothing, reports nothing, says so in its summary, and passes.
#
# ## Everything it does, it does with the deployer role's enumerated grants
#
#   s3:PutObject                      upload the source tarball (and the
#                                     seed file), under `build-contexts/`
#                                     of the stack's bucket
#   codebuild:StartBuild              start the image build
#   lambda:InvokeFunction             retire / destroy / read the status of
#                                     a preview through the stack's own
#                                     controller function, and nothing else
#
# and nothing else — no ECR, no RDS, no Secrets Manager, no SSM. A test
# derives both sets (the calls in this file, the actions in the policy) and
# asserts they are EQUAL, so an unused grant is as much a failure as an
# ungranted call — less `codebuild:BatchGetBuilds`, which the role keeps for
# callers still on v7 (which polls its own build) and this version no longer
# calls.
#
# ## Secrets never reach the runner
#
# The database master password and the application's secrets are injected by
# ECS under the stack's own task execution role. The runner holds exactly one
# credential — the Churner preview token — and it crosses only as an action
# input, never a command line.
#
# This file is authored in the churner monorepo under
# `github-actions/preview-workflow/`; `shared/tests/preview-workflow.test.ts`
# asserts its interface and its action pins.

name: Churner preview

on:
  workflow_call:
    inputs:
      project:
        description: Churner project key, e.g. `ACME`.
        required: true
        type: string
      preview-zone:
        description: >-
          The zone the preview stack created — its `PreviewBaseDomain`
          output. Previews answer at `<pr>.<preview-zone>`:
          `preview.<your domain>` on a domain of your own,
          `<key>.churner.dev` itself on the Churner domain.
        required: true
        type: string
      build-context-bucket:
        description: >-
          The stack's build-context bucket — its `PreviewBuildContextBucket`
          output, `churner-preview-<projectKey>-src-<account>`. The pull
          request's source is uploaded here and CodeBuild builds from it.
        required: true
        type: string
      role-arn:
        description: >-
          ARN of the stack's deployer role,
          `arn:aws:iam::<account>:role/churner-preview-deployer-<projectKey>`.
        required: true
        type: string
      codebuild-project:
        description: >-
          The stack's CodeBuild project, `churner-preview-<projectKey>`.
        required: true
        type: string
      secrets-prefix:
        description: >-
          The Secrets Manager prefix the stack was configured with, e.g.
          `acme/preview`. Application secrets are read from
          `<prefix>/<NAME>` and reach the container as `<NAME>`.
        required: true
        type: string
      aws-region:
        description: Region the preview stack lives in.
        required: true
        type: string
      health-path:
        description: >-
          Rooted path the readiness gate polls under the preview URL. `/` at
          rest, which is right for a site and wrong for an API that answers
          404 there.
        required: false
        type: string
        default: /
      ttl-hours:
        description: >-
          How long the preview is expected to live. Mirrors the module's
          `PreviewTtlHours`; the controller stamps it onto the preview's
          service and the stack's sweep enforces it. At the
          value 48, the "Fetch preview settings" step fetches whatever the
          project's Previews settings card has saved and uses THAT instead —
          the same live channel `max-open-previews` already has. Set this to
          anything OTHER than 48 and it wins over the fetched value; to pin
          48 itself, set it on the Previews settings card, because GitHub
          Actions cannot tell a caller that wrote 48 on purpose from one that
          never mentioned the input. The fetch never re-dates a preview
          already open.
        required: false
        type: number
        default: 48
      max-open-previews:
        description: >-
          Mirrors the module's `PreviewMaxOpenPreviews` — the most previews
          that may be open at once, empty for no limit. It reaches the
          controller on every run, so a changed limit takes effect on the
          very next pull-request push; a deploy past it is QUEUED, never
          refused. Left empty, the "Fetch preview settings" step fetches
          whatever the project's Previews settings card has saved and uses
          THAT instead; set this explicitly and it wins over the fetched
          value.
        required: false
        type: string
        default: ''
      runtime:
        description: >-
          Where previews run. `fargate` — one Fargate service per pull
          request, deployed through the stack's controller function — is the
          only runtime; any other value is refused before anything is built.
          Churner's callers pass it explicitly.
        required: false
        type: string
        default: fargate
      controller-function:
        description: >-
          The stack's controller function, its `PreviewControllerFunctionName`
          output. The deployer role may invoke this function and nothing else.
        required: true
        type: string
      tracker-url:
        description: Base URL of your Churner instance. Must be https.
        required: false
        type: string
        default: https://churner.ai
      runs-on:
        description: >-
          The runner both jobs run on, as JSON: a label string
          (`"ubuntu-latest"`, the default — a GitHub-hosted runner) or an
          array of labels a self-hosted runner carries, e.g.
          `["self-hosted","linux","x64"]`. A self-hosted runner needs bash,
          git, curl, jq and AWS CLI v2 on PATH — what GitHub's `ubuntu-latest`
          image carries and every step here calls without a setup step; no
          Docker (CodeBuild builds the image). New in v7.
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      preview-token:
        description: >-
          The project's Churner preview token, minted in the project's Access
          settings and stored as a repository secret.
        required: true

jobs:
  deploy:
    name: Preview
    if: github.event.action != 'closed'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # One run of a pull request's preview at a time, even when the caller
    # sets no concurrency of its own: a preview is named by its pull request
    # alone. Its own group name, never the caller's, so a caller that does
    # set one cannot deadlock against it.
    concurrency:
      group: churner-preview-job-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # The job uploads the commit and starts its build; it waits for neither
    # the build nor the preview. Past 10 minutes it is not slow, it is stuck,
    # and a stuck job holds a runner and leaves the record at `building`.
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      # v6 runs previews on Fargate only. A caller still asking for the
      # retired host runtime is told so here, before anything is built or
      # reported, rather than failing somewhere less legible.
      - name: Check the runtime
        env:
          RUNTIME: ${{ inputs.runtime }}
        run: |
          if [ "$RUNTIME" != "fargate" ]; then
            echo "::error::runtime '${RUNTIME}' is not supported: previews run on Fargate only (runtime: fargate, with controller-function set to the stack's PreviewControllerFunctionName output)"
            exit 1
          fi

      # The head commit, not the merge commit: `.churner/preview/` is read
      # from it, and the record's identity is `(project, pr, sha)`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The image is built with `docker build .` at the root of the uploaded
      # commit. A repository with no root Dockerfile has no app to preview
      # yet — a fresh project whose first app change has not merged — and
      # building it can only fail. So nothing is built and nothing new is
      # reported: no record means no preview, which is the truth, whereas a
      # `failed` would say a preview broke and a failing required check would
      # block every pull request (Churner's own workflow update included)
      # until an app exists. Every later step is gated on `present`. The one
      # thing a no-Dockerfile run DOES do is retire a preview an EARLIER
      # commit of this pull request left running (below).
      - name: Look for a Dockerfile
        id: app
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'present=false' >> "$GITHUB_OUTPUT"
          # SC2016: the backticks are Markdown for the summary, not a command.
          # shellcheck disable=SC2016
          message='Nothing to preview yet — previews build from a file named `Dockerfile` at the repository root, and this commit has none. Previews start once the app has one.'
          echo "::notice title=No preview::${message}"
          printf '### Nothing to preview yet\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"

      # A pull request whose latest commit deleted the Dockerfile may still
      # have a preview from an earlier commit — a container serving code the
      # branch no longer has, and a record saying `ready`. Tear it down with
      # the same checksum-verified script the close teardown runs, and report
      # `destroyed` ONLY when there was a container to remove; a pull request
      # that never had a preview posts nothing. Entirely fail-soft: a
      # repository with no app yet must never get a red check from here, and
      # the TTL reaper is the backstop for anything this could not reach.
      - if: steps.app.outputs.present == 'false'
        id: credentials-retire
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@796449b3e38e3c256861227399e58b780e0e5538 # v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: churner-preview-retire-${{ github.event.pull_request.number }}

      # The same, on Fargate: ask the controller whether this pull request
      # has a preview, and destroy it only if it does. Fail-soft likewise.
      - name: Retire an earlier Fargate preview of this pull request
        id: retire-fargate
        if: steps.app.outputs.present == 'false' && steps.credentials-retire.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTROLLER_FUNCTION: ${{ inputs.controller-function }}
        run: |
          set -uo pipefail

          skip() { echo "::warning::could not check for an earlier preview of this pull request ($1); the stack's sweep removes any left behind"; exit 0; }

          case "$PR_NUMBER" in
            ""|*[!0-9]*) skip "unusable pull-request number" ;;
          esac
          case "$CONTROLLER_FUNCTION" in
            ""|*[!A-Za-z0-9_-]*) skip "controller-function must be the stack's controller function name" ;;
          esac

          jq -n --arg pr "$PR_NUMBER" '{action: "status", pr: $pr}' > "${RUNNER_TEMP}/status.json" || skip "could not build the request"
          aws lambda invoke \
            --function-name "$CONTROLLER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload "file://${RUNNER_TEMP}/status.json" \
            "${RUNNER_TEMP}/status-out.json" >/dev/null || skip "the controller could not be reached"
          if [ "$(jq -r '.exists // false' "${RUNNER_TEMP}/status-out.json")" != "true" ]; then
            echo "Pull request #${PR_NUMBER} has no preview to remove."
            exit 0
          fi

          jq -n --arg pr "$PR_NUMBER" '{action: "destroy", pr: $pr}' > "${RUNNER_TEMP}/destroy.json" || skip "could not build the request"
          aws lambda invoke \
            --function-name "$CONTROLLER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 330 \
            --payload "file://${RUNNER_TEMP}/destroy.json" \
            "${RUNNER_TEMP}/destroy-out.json" >/dev/null || skip "the controller could not be reached"
          [ "$(jq -r '.ok // false' "${RUNNER_TEMP}/destroy-out.json")" = "true" ] \
            || skip "$(jq -r '.error // "the controller refused"' "${RUNNER_TEMP}/destroy-out.json")"
          echo "Removed the preview an earlier commit of pull request #${PR_NUMBER} left running."
          echo 'torn-down=true' >> "$GITHUB_OUTPUT"

      - if: steps.retire-fargate.outputs.torn-down == 'true'
        continue-on-error: true
        uses: churner-ai/report-preview@v1
        with:
          token: ${{ secrets.preview-token }}
          project: ${{ inputs.project }}
          type: destroyed
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          tracker-url: ${{ inputs.tracker-url }}

      # `building` next, before anything that can fail once there is an app
      # to build. Without it a build that dies in its first minute is
      # indistinguishable from one that was never attempted.
      - if: steps.app.outputs.present == 'true'
        uses: churner-ai/report-preview@v1
        with:
          token: ${{ secrets.preview-token }}
          project: ${{ inputs.project }}
          type: building
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          tracker-url: ${{ inputs.tracker-url }}
          build-log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - if: steps.app.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@796449b3e38e3c256861227399e58b780e0e5538 # v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: churner-preview-${{ github.event.pull_request.number }}

      # The durable settings channel. Reads what the settings card has SAVED
      # (`GET …/previews/settings`, authenticated by the same preview token
      # every other CI call uses) so a cap or TTL set there reaches the
      # controller on the very next push, with no re-apply. Fail-SOFT: a
      # tracker outage must never fail a preview deploy, so a failed fetch
      # just leaves this run on the explicit workflow inputs and the stack's
      # own defaults. Read BEFORE the build starts: the deploy request rides
      # on the build.
      - name: Fetch preview settings
        id: settings
        if: steps.app.outputs.present == 'true'
        env:
          TRACKER_URL: ${{ inputs.tracker-url }}
          PROJECT: ${{ inputs.project }}
          INPUT_TTL_HOURS: ${{ inputs.ttl-hours }}
          INPUT_MAX_OPEN_PREVIEWS: ${{ inputs.max-open-previews }}
          # Routed through `env:`, like every other value this workflow reads
          # inside a `run:` body — never the raw secret expression written
          # directly into the script text, which is both untestable (a test
          # executing this step's body cannot substitute a YAML expression
          # bash never sees) and inconsistent with how the rest of this file
          # threads a value into a shell script.
          PREVIEW_TOKEN: ${{ secrets.preview-token }}
        run: |
          set -uo pipefail

          fetched_ttl=""
          fetched_max_open=""
          # Only a bare https origin is ever called with the token: no path,
          # port, user-info or query a caller could smuggle another address in.
          if ! [[ "$TRACKER_URL" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::warning::tracker-url must be a bare https origin such as https://churner.ai (got '${TRACKER_URL}') — using this run's own inputs and the stack's own defaults"
            TRACKER_URL=""
          fi
          # The token reaches curl through a CONFIG FILE on stdin (`-K -`),
          # never as a `-H` argv entry — an argv is visible to every other
          # process on the runner (`ps`), a config file on a pipe is not.
          # `--proto '=https'`: the `TRACKER_URL` input is caller-supplied,
          # and without this curl would happily follow a scheme a caller
          # mistyped or a redirect downgraded to, sending the bearer token in
          # the config file over whatever protocol the URL names.
          case "$PROJECT" in
            ""|*[!A-Za-z0-9_-]*) TRACKER_URL="" ;;
          esac
          body=""
          if [ -n "$TRACKER_URL" ]; then
            body="$(
              printf 'header = "Authorization: Bearer %s"\n' "$PREVIEW_TOKEN" \
                | curl -fsS --max-time 10 --proto '=https' --max-redirs 0 -K - \
                    "${TRACKER_URL}/api/projects/${PROJECT}/previews/settings" 2>/dev/null
            )" || body=""
          fi
          if [ -n "$body" ]; then
            fetched_ttl="$(printf '%s' "$body" | jq -r '.ttlHours // empty' 2>/dev/null)" || fetched_ttl=""
            fetched_max_open="$(printf '%s' "$body" | jq -r '.maxOpenPreviews // empty' 2>/dev/null)" || fetched_max_open=""
          fi
          # A non-empty body that yielded NOTHING usable from either field
          # is treated the same as an outright fetch failure: either the
          # response was not this route's JSON shape (jq's own parse failure
          # is swallowed by the `|| ...` fallbacks above, so this is the only
          # signal left), or the project genuinely has neither value set —
          # which means the module is not opted in, and this workflow has
          # nothing to deploy to regardless.
          if [ -z "$fetched_ttl" ] && [ -z "$fetched_max_open" ]; then
            echo "::warning::could not fetch preview settings from ${TRACKER_URL} — using this run's own inputs and the stack's own defaults"
          fi

          # An EXPLICIT workflow input — one that differs from its schema
          # default — wins over the fetched value: a caller's own workflow
          # file is a deliberate override. GitHub Actions cannot tell "the
          # caller wrote this on purpose" from "the caller never mentioned
          # it", so the schema default is the only observable signal.
          ttl_hours="$INPUT_TTL_HOURS"
          if [ "$ttl_hours" = "48" ] && [ -n "$fetched_ttl" ]; then
            ttl_hours="$fetched_ttl"
          fi
          max_open_previews="$INPUT_MAX_OPEN_PREVIEWS"
          if [ -z "$max_open_previews" ] && [ -n "$fetched_max_open" ]; then
            max_open_previews="$fetched_max_open"
          fi

          # Heredoc form, not `name=value` — a value containing a newline in
          # the `name=value` form is read as further runner commands, and
          # both values here (fetched from the tracker) are outside this
          # workflow's control.
          {
            echo 'ttl-hours<<CHURNER_OUTPUT_EOF'
            echo "$ttl_hours"
            echo 'CHURNER_OUTPUT_EOF'
            echo 'max-open-previews<<CHURNER_OUTPUT_EOF'
            echo "$max_open_previews"
            echo 'CHURNER_OUTPUT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Upload the commit, start its image build, and END. The runner does
      # not wait for the build: the deploy request rides on the build as its
      # `CHURNER_PREVIEW_REQUEST` environment variable, and when the build
      # finishes the stack's own events function — handed the build by an
      # EventBridge rule — deploys it as this pull request's Fargate service,
      # waits for its address to answer, and reports `ready`, `queued` or
      # `failed` to Churner itself (a failed build with its CodeBuild log).
      # Secrets are injected by ECS under the stack's own task execution
      # role; the runner never holds one.
      - name: Start the image build
        id: build
        if: steps.app.outputs.present == 'true'
        env:
          CODEBUILD_PROJECT: ${{ inputs.codebuild-project }}
          BUILD_CONTEXT_BUCKET: ${{ inputs.build-context-bucket }}
          REPOSITORY: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ORDER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TTL_HOURS: ${{ steps.settings.outputs.ttl-hours }}
          MAX_OPEN_PREVIEWS: ${{ steps.settings.outputs.max-open-previews }}
          PREVIEW_ZONE: ${{ inputs.preview-zone }}
          HEALTH_PATH: ${{ inputs.health-path }}
        run: |
          set -euo pipefail

          # Checked before anything is uploaded: each lands in an S3 key, a
          # CodeBuild argument or the deploy request, and a refusal is only
          # useful up front.
          case "$BUILD_CONTEXT_BUCKET" in
            ""|*[!a-z0-9.-]*) echo "::error::build-context-bucket must be an S3 bucket name (got '${BUILD_CONTEXT_BUCKET}')"; exit 1 ;;
          esac
          case "$REPOSITORY" in
            ""|*[!A-Za-z0-9._-]*) echo "::error::refusing an unusable repository name"; exit 1 ;;
          esac
          case "$HEAD_SHA" in
            ""|*[!0-9a-f]*) echo "::error::refusing an unusable head sha"; exit 1 ;;
          esac
          case "$PR_NUMBER" in
            ""|*[!0-9]*) echo "::error::refusing an unusable pull-request number"; exit 1 ;;
          esac
          case "$TTL_HOURS" in
            ""|*[!0-9]*) echo "::error::ttl-hours must be a whole number of hours (got '${TTL_HOURS}')"; exit 1 ;;
          esac
          case "$MAX_OPEN_PREVIEWS" in
            '') ;;
            *[!0-9]*) echo "::error::max-open-previews must be a whole number of open previews, or empty for no limit (got '${MAX_OPEN_PREVIEWS}')"; exit 1 ;;
          esac
          case "$PREVIEW_ZONE" in
            ""|*[!a-z0-9.-]*) echo "::error::preview-zone must be a lower-case DNS name (got '${PREVIEW_ZONE}')"; exit 1 ;;
          esac

          # Repository conventions, both optional. See docs/customer/preview-seed.md.
          seed_key=''
          if [ -f .churner/preview/seed.sql ]; then
            seed_bytes="$(wc -c < .churner/preview/seed.sql | tr -d '[:space:]')"
            if [ "$seed_bytes" -gt 60000 ]; then
              echo "::error::.churner/preview/seed.sql is ${seed_bytes} bytes; the limit is 60000. Move the bulk into a migration your app runs at boot."
              exit 1
            fi
            seed_key="build-contexts/${REPOSITORY}/${PR_NUMBER}/${HEAD_SHA}.seed.sql"
          fi

          # REJECTED, not scrubbed: a name the controller could not inject is an error here, not a silent drop.
          secret_keys='[]'
          if [ -f .churner/preview/secrets ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              case "$line" in
                ''|'#'*) continue ;;
              esac
              case "$line" in
                *:generate) name="${line%:generate}" ;;
                *:*) echo "::error file=.churner/preview/secrets::'${line}' has an unknown suffix (the only one understood is ':generate')"; exit 1 ;;
                *) name="$line" ;;
              esac
              case "$name" in
                [A-Za-z_]*) ;;
                *) echo "::error file=.churner/preview/secrets::'${line}' is not an environment-variable name (it must start with a letter or underscore)"; exit 1 ;;
              esac
              case "$name" in
                *[!A-Za-z0-9_]*) echo "::error file=.churner/preview/secrets::'${line}' is not an environment-variable name (letters, digits and underscore only)"; exit 1 ;;
              esac
              secret_keys="$(printf '%s' "$secret_keys" | jq -c --arg k "$line" '. + [$k]')"
            done < .churner/preview/secrets
            echo "Secrets to inject: ${secret_keys}"
          fi

          # The source comes from THIS checkout — the exact head commit, as a
          # tarball with no history — never from a clone CodeBuild makes. So
          # the build needs no GitHub credential of any kind, and a private
          # repository needs no CodeBuild source credential.
          archive="${HEAD_SHA}.tar.gz"
          key="build-contexts/${REPOSITORY}/${PR_NUMBER}/${archive}"
          git archive --format=tar.gz -o "${RUNNER_TEMP}/${archive}" "$HEAD_SHA"
          # Every commit is its own image tag, so the controller can delete
          # exactly this pull request's earlier images once this one serves
          # (a single reused tag would leave each earlier image untagged).
          image_tag="pr-${PR_NUMBER}-$(printf '%s' "$HEAD_SHA" | cut -c1-12 | tr 'A-F' 'a-f')"

          # The seed goes up first: the build's source archive is what the
          # controller checks is still there before deploying, so once the
          # archive is uploaded everything the deploy reads is in place.
          if [ -n "$seed_key" ]; then
            aws s3api put-object \
              --bucket "$BUILD_CONTEXT_BUCKET" \
              --key "$seed_key" \
              --body .churner/preview/seed.sql \
              --output text >/dev/null
            echo "Seeding from .churner/preview/seed.sql (${seed_bytes} bytes)"
          fi
          # A stack applied before the bucket existed answers NoSuchBucket (or
          # AccessDenied — the role predates the grant too). Churner does not
          # move a repository onto this version until the stack reports the
          # bucket, so this is the one-line reason if it happens anyway.
          if ! upload_err="$(
            aws s3api put-object \
              --bucket "$BUILD_CONTEXT_BUCKET" \
              --key "$key" \
              --body "${RUNNER_TEMP}/${archive}" \
              --output text 2>&1 >/dev/null
          )"; then
            case "$upload_err" in
              *NoSuchBucket*|*AccessDenied*)
                echo "::error::The build-context bucket ${BUILD_CONTEXT_BUCKET} doesn't exist yet, or this workflow's role can't write to it — apply the stack update from Churner's Infrastructure page."
                ;;
              *)
                echo "::error::Uploading the build context to ${BUILD_CONTEXT_BUCKET} failed: ${upload_err}"
                ;;
            esac
            exit 1
          fi
          echo "Uploaded s3://${BUILD_CONTEXT_BUCKET}/${key}"

          # What the controller deploys once the build succeeds — the same
          # fields its `deploy` action takes, less the image (the build's own
          # tag in the stack's own registry, which the controller assembles).
          request="$(
            jq -cn \
              --arg pr "$PR_NUMBER" \
              --arg sha "$HEAD_SHA" \
              --arg health "$HEALTH_PATH" \
              --arg ttl "$TTL_HOURS" \
              --arg cap "$MAX_OPEN_PREVIEWS" \
              --arg seed "$seed_key" \
              --arg order "$RUN_ORDER" \
              --arg run "$RUN_URL" \
              --argjson keys "$secret_keys" \
              '{pr: $pr, sha: $sha, healthPath: $health, ttlHours: $ttl, maxOpenPreviews: $cap, secretKeys: $keys, seedKey: $seed, runOrder: $order, runUrl: $run}'
          )"
          # A file, not the CLI's `name=…,value=…` shorthand: the request is
          # JSON, and the shorthand splits on its commas.
          jq -n \
            --arg tag "$image_tag" \
            --arg archive "$archive" \
            --arg request "$request" \
            '[{name: "IMAGE_TAG", value: $tag, type: "PLAINTEXT"},
              {name: "SOURCE_ARCHIVE", value: $archive, type: "PLAINTEXT"},
              {name: "CHURNER_PREVIEW_REQUEST", value: $request, type: "PLAINTEXT"}]' \
            > "${RUNNER_TEMP}/build-environment.json"

          # One provisioned project serves every pull request. Its own source
          # is S3, at the bucket's `build-contexts/` prefix, so only the
          # LOCATION is overridden (the type never changes, which is what
          # keeps the project's inline buildspec); `SOURCE_ARCHIVE` tells the
          # buildspec which file to unpack — CodeBuild extracts only a zip.
          build_arn="$(
            aws codebuild start-build \
              --project-name "$CODEBUILD_PROJECT" \
              --source-location-override "${BUILD_CONTEXT_BUCKET}/${key}" \
              --environment-variables-override "file://${RUNNER_TEMP}/build-environment.json" \
              --query 'build.arn' --output text
          )"

          # The console URL is assembled from the build's OWN arn, so no
          # account-id lookup and no extra grant is needed for it.
          account="$(printf '%s' "$build_arn" | cut -d: -f5)"
          region="$(printf '%s' "$build_arn" | cut -d: -f4)"
          build_id="${build_arn#*:build/}"
          escaped_id="$(printf '%s' "$build_id" | sed 's/:/%3A/')"
          log_url="https://${region}.console.aws.amazon.com/codesuite/codebuild/${account}/projects/${CODEBUILD_PROJECT}/build/${escaped_id}"
          echo "Started CodeBuild ${build_id} — ${log_url}"
          # Heredoc form, not `name=value`: a value containing a newline in
          # the `name=value` form is read as further commands to the runner.
          {
            echo 'log-url<<CHURNER_OUTPUT_EOF'
            echo "$log_url"
            echo 'CHURNER_OUTPUT_EOF'
            echo 'image-tag<<CHURNER_OUTPUT_EOF'
            echo "$image_tag"
            echo 'CHURNER_OUTPUT_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Preview building'
            echo
            echo "Commit \`${HEAD_SHA}\` is building as \`${image_tag}\` ([build log](${log_url}))."
            echo "When it finishes, the preview stack deploys it at https://${PR_NUMBER}.${PREVIEW_ZONE} and tells Churner when it answers — this job does not wait."
          } >> "$GITHUB_STEP_SUMMARY"

      # A failure HERE, before the build started, is reported: once it has
      # started, the stack's events function reports the build's outcome.
      # A CANCELLED run is not a verdict and reports nothing: it was replaced
      # by a newer run of the same pull request (which reports for its own
      # commit — the same one, when a label and a push raced on one head), so
      # a `failed` here would only flash red and send the ticket back for
      # nothing. A record a cancelled run leaves at `building` is Churner's
      # stale-`building` deadline to settle. Never for a commit with no
      # Dockerfile either: nothing was attempted there, so nothing failed.
      - if: failure() && steps.app.outputs.present != 'false'
        uses: churner-ai/report-preview@v1
        with:
          token: ${{ secrets.preview-token }}
          project: ${{ inputs.project }}
          type: failed
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          error: The preview pipeline failed before its image build started.
          tracker-url: ${{ inputs.tracker-url }}
          build-log-url: ${{ steps.build.outputs.log-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}

  # Its own job so it runs whether the pull request merged or was abandoned
  # (a merged one's preview is kept until its deadline, then the stack's
  # sweep removes it). The TTL reaper would get there eventually; "eventually" is up to
  # `ttl-hours` of a database and a port held by a branch that no longer
  # exists.
  teardown:
    name: Preview teardown
    if: github.event.action == 'closed'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # One run of a pull request's preview at a time, even when the caller
    # sets no concurrency of its own: a preview is named by its pull request
    # alone. Its own group name, never the caller's, so a caller that does
    # set one cannot deadlock against it.
    concurrency:
      group: churner-preview-job-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      # v6 runs previews on Fargate only. A caller still asking for the
      # retired host runtime is told so here, before anything is built or
      # reported, rather than failing somewhere less legible.
      - name: Check the runtime
        env:
          RUNTIME: ${{ inputs.runtime }}
        run: |
          if [ "$RUNTIME" != "fargate" ]; then
            echo "::error::runtime '${RUNTIME}' is not supported: previews run on Fargate only (runtime: fargate, with controller-function set to the stack's PreviewControllerFunctionName output)"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@796449b3e38e3c256861227399e58b780e0e5538 # v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: churner-preview-teardown-${{ github.event.pull_request.number }}

      # A MERGED pull request's preview is KEPT, asleep, for the project's
      # keep hours (`keepMergedHours` in the saved settings; 0 = torn down
      # now), and the stack's sweep tears it down at that deadline and
      # reports `destroyed` itself. Anything else — closed without merging,
      # a keep of 0 hours, a stack whose controller predates `keep` — is the
      # teardown: the controller writes the pull request's tombstone before
      # anything else, so from its first step the teardown is committed: no
      # build still running may put the preview back, and the stack's sweep
      # finishes any teardown this call could not. A refusal fails the job —
      # never a warning — and `destroyed` is reported only once the stack
      # has removed the preview or committed to removing it (`tombstoned`);
      # the sweep reports `destroyed` itself when it finishes one. The keep
      # settings are fetched like the deploy's (fail-soft: without them the
      # stack's own values apply).
      - name: Tear the Fargate preview down
        id: teardown
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          CONTROLLER_FUNCTION: ${{ inputs.controller-function }}
          TRACKER_URL: ${{ inputs.tracker-url }}
          PROJECT: ${{ inputs.project }}
          PREVIEW_TOKEN: ${{ secrets.preview-token }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ""|*[!0-9]*) echo "::error::refusing an unusable pull-request number"; exit 1 ;;
          esac
          case "$CONTROLLER_FUNCTION" in
            ""|*[!A-Za-z0-9_-]*) echo "::error::controller-function must be the stack's controller function name"; exit 1 ;;
          esac
          invoke() {
            aws lambda invoke \
              --function-name "$CONTROLLER_FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --cli-read-timeout 330 \
              --payload "file://${RUNNER_TEMP}/teardown.json" \
              "${RUNNER_TEMP}/teardown-out.json" >/dev/null
          }
          if [ "${MERGED:-}" = "true" ]; then
            TRACKER_URL="${TRACKER_URL:-}"
            PROJECT="${PROJECT:-}"
            keep_hours=""
            max_kept=""
            if ! [[ "$TRACKER_URL" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then TRACKER_URL=""; fi
            case "$PROJECT" in ""|*[!A-Za-z0-9_-]*) TRACKER_URL="" ;; esac
            if [ -n "$TRACKER_URL" ]; then
              # The token reaches curl through a config file on stdin, never argv.
              body="$(
                printf 'header = "Authorization: Bearer %s"\n' "${PREVIEW_TOKEN:-}" \
                  | curl -fsS --max-time 10 --proto '=https' --max-redirs 0 -K - \
                      "${TRACKER_URL}/api/projects/${PROJECT}/previews/settings" 2>/dev/null
              )" || body=""
              keep_hours="$(printf '%s' "$body" | jq -r '.keepMergedHours // empty' 2>/dev/null)" || keep_hours=""
              max_kept="$(printf '%s' "$body" | jq -r '.maxKeptPreviews // empty' 2>/dev/null)" || max_kept=""
            fi
            case "$keep_hours" in *[!0-9]*) keep_hours="" ;; esac
            case "$max_kept" in *[!0-9]*) max_kept="" ;; esac
            jq -n --arg pr "$PR_NUMBER" --arg hours "$keep_hours" --arg cap "$max_kept" \
              '{action: "keep", pr: $pr, keepHours: $hours, maxKeptPreviews: $cap}' > "${RUNNER_TEMP}/teardown.json"
            invoke
            if [ "$(jq -r '.kept // false' "${RUNNER_TEMP}/teardown-out.json")" = "true" ]; then
              echo "Kept the merged pull request's preview asleep until $(jq -r '.keepUntil // "its deadline"' "${RUNNER_TEMP}/teardown-out.json"); the stack tears it down then."
              exit 0
            fi
            # A stack whose controller predates `keep` refuses the action:
            # tear the preview down as before rather than leave it running.
            if jq -r '.error // ""' "${RUNNER_TEMP}/teardown-out.json" | grep -q "^unknown action 'keep'"; then
              echo "This preview stack cannot keep a merged pull request's preview yet; tearing it down."
              jq -n --arg pr "$PR_NUMBER" '{action: "destroy", pr: $pr}' > "${RUNNER_TEMP}/teardown.json"
              invoke
            fi
          else
            jq -n --arg pr "$PR_NUMBER" '{action: "destroy", pr: $pr}' > "${RUNNER_TEMP}/teardown.json"
            invoke
          fi
          if [ "$(jq -r '.ok // false' "${RUNNER_TEMP}/teardown-out.json")" = "true" ]; then
            echo 'committed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason="$(jq -r '.error // "the controller returned no answer"' "${RUNNER_TEMP}/teardown-out.json")"
          if [ "$(jq -r '.tombstoned // false' "${RUNNER_TEMP}/teardown-out.json")" = "true" ]; then
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "::error::teardown refused: ${reason}"
          exit 1

      # Only for a teardown the stack performed or committed to: a record
      # saying `destroyed` while the preview may still be running would hide
      # it. `destroyed` is accepted from any state by the contract.
      - if: always() && steps.teardown.outputs.committed == 'true'
        uses: churner-ai/report-preview@v1
        with:
          token: ${{ secrets.preview-token }}
          project: ${{ inputs.project }}
          type: destroyed
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          tracker-url: ${{ inputs.tracker-url }}
